name: Fix Lahat logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add logo to existing header only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="mobile-brand">להט <small>ניהול נכסים</small></div>'
          new='<div class="mobile-brand"><img src="./logo.png" alt="להט" style="height:32px;width:32px;object-fit:contain;vertical-align:middle;margin-left:8px">להט <small>ניהול נכסים</small></div>'
          old2='<aside><div><h1>להט</h1><small>ניהול נכסים ושיווק</small></div>'
          new2='<aside><div><img src="./logo.png" alt="להט תיווך נדל״ן" style="width:110px;max-width:100%;height:auto;display:block;margin:0 auto 12px"><h1>להט</h1><small>ניהול נכסים ושיווק</small></div>'
          assert old in s and old2 in s, 'Original header changed; refusing patch'
          s=s.replace(old,new,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit logo fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Display existing logo in desktop and mobile headers" || exit 0
          git push
