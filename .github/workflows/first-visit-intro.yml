name: Install first-visit tutorial
on:
  push:
    paths:
      - 'first-visit-intro.js'
      - '.github/workflows/first-visit-intro.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load first-visit tutorial script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          tag='<script src="./first-visit-intro.js" defer></script>'
          if tag not in html:
              assert '</head>' in html
              p.write_text(html.replace('</head>',tag+'\n</head>',1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Load first visit tutorial without changing app"
            git push
          fi
