name: Install Google sign-in UI
on:
  push:
    paths:
      - 'google-auth.js'
      - '.github/workflows/google-signin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Google login script without changing existing logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<script src="./google-auth.js" defer></script>' in s:
              print('Already installed')
          else:
              assert '</head>' in s, 'Missing head element'
              s=s.replace('</head>','<script src="./google-auth.js" defer></script></head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Load Google sign-in UI"
            git push
          fi
